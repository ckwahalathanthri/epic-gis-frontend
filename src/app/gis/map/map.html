<div class="map-wrapper">

  <!-- Smart Sub-components bound to the Core Data -->
  <app-map-edit-panel 
    (onSave)="saveFeature()" 
    (onCancel)="cancelEdit()">
  </app-map-edit-panel>

  <app-map-popup 
    (onEdit)="openEditFromPopup()">
  </app-map-popup>

    <app-map-popup 
    (onEdit)="openEditFromPopup()"
    (onDelete)="deleteFeatureFromPopup()">
  </app-map-popup>

  <!-- Core Map Rendering Container -->
  <div id="mapViewDiv" class="map-view"></div>

  <!-- Loading Overlay -->
   <app-map-loading></app-map-loading>
</div>
