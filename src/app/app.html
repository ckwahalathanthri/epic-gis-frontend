<!-- topbar -->
<header class="topbar">
  <div class="topbar-left">
    <div class="logo" style="cursor: pointer" (click)="goToMap()">Lanka GIS</div>
    <nav class="map-type"></nav>
    <div class="top-actions">
      <!-- We kept the non-data tools up here -->
      <button title="Edit Features">✏️ Edit Features
        <span style="background:#34c759;color:#06201a;padding:2px 6px;border-radius:12px;margin-left:6px;">ON</span>
      </button>
      <button title="Analytics">📊 Analytics</button>
    </div>
  </div>
  <div class="topbar-center">
    <input class="search" placeholder="Search address or coordinates..." />
  </div>
  <div class="topbar-right">
    <button class="icon-btn" (click)="toggleCesium()">{{ useCesium ? 'Cesium' : 'ArcGIS' }}</button>
    <!-- ...other right buttons... -->
  </div>
</header>

<!-- App-level toast -->
<div class="app-toast" *ngIf="toastMessage">
  <div class="app-toast-inner">{{ toastMessage }}</div>
</div>

<div class="app-shell" *ngIf="showMap" style="display: flex; height: calc(100vh - var(--topbar-height)); background: #0a1426;">
  
  <!-- NEW SIDEBAR COMPONENT -->
  <div style="width: 300px; min-width: 300px; border-right: 1px solid #1e3a5f;">
    <app-sidebar 
      (onToggle3D)="triggerToggle3D()" 
      (onUploadEvent)="triggerUpload($event)"
      (onAddWebLayer)="triggerAddFeatureLayer()"
      (onAddKML)="triggerAddKML()">
    </app-sidebar>
  </div>

  <!-- THE MAP FRAME -->
  <div class="map-area" style="flex: 1; position: relative; height: 100%;">
    <app-map *ngIf="!useCesium" style="width:100%;height:100%;display:block;"></app-map>
    <app-cesium-map *ngIf="useCesium" style="width:100%;height:100%;display:block;"></app-cesium-map>
  </div>
</div>

<div class="page-container" *ngIf="!showMap" style="height: 100vh; padding-top: 64px; overflow-y: auto;">
  <router-outlet></router-outlet>
</div>
